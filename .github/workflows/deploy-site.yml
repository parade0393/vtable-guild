name: Deploy Site

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - 'play/**'
      - 'perf/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo 会按依赖图依次构建：packages → site（文档站现在真的 import 工作区包）→ play/perf
      - name: Build packages, site and playground
        run: pnpm build

      # Playground 与性能对照页都是独立的 Vite 应用，分别挂在文档站 base 下的
      # /play/ 与 /perf/，和文档站共用同一个 Pages artifact
      - name: Assemble playground and perf into site output
        run: |
          rm -rf site/.vitepress/dist/play
          cp -r play/dist site/.vitepress/dist/play
          rm -rf site/.vitepress/dist/perf
          cp -r perf/dist site/.vitepress/dist/perf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
